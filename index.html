<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>رابط المسائل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3eee4;--navy:#163056;--line:#e6dcc8}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);font-family:Cairo,Tahoma,sans-serif;color:#1c2d4a}
button,input,textarea,select{font-family:inherit}.hidden{display:none!important}
.login{min-height:100dvh;display:grid;place-items:center;padding:20px}
.box{width:min(420px,100%);background:#fffcf6;border:1px solid var(--line);border-radius:24px;padding:28px 22px;text-align:center}
.logo{width:56px;height:56px;margin:0 auto 12px;border-radius:14px;background:#123047;color:#7ad7c7;display:grid;place-items:center}
.box h1{font-size:28px;color:var(--navy)}.field{text-align:right;margin-bottom:10px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}
.field input,.field select,.area{width:100%;height:44px;border:1px solid #e2d7bf;border-radius:12px;padding:0 12px;font-size:15px;background:#fff}.area{height:auto;min-height:88px;padding:10px}
.go{width:100%;height:50px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:800;font-size:17px}
.hint{margin-top:12px;background:#f7f1e4;border-radius:10px;padding:10px;font-size:13px;color:#5b6a80}.err{display:none;color:#b42318;font-weight:800;margin-top:8px}
.app{min-height:100dvh;padding:12px 12px 150px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{display:flex;gap:8px;align-items:center}.brand .logo{width:40px;height:40px;margin:0}.brand h2{font-size:18px}.brand small{display:block;font-size:11px;color:#5b6a80}
.actions button{height:34px;border:0;border-radius:999px;padding:0 12px;font-weight:800}.b1{background:#fff;border:1px solid var(--line)!important}.b2{background:var(--navy);color:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1px solid #eee4d0;border-radius:16px;padding:12px;display:flex;justify-content:space-between;align-items:center;min-height:72px}
.stat b{display:block;font-size:26px;color:var(--navy)}.stat span{font-size:12px;color:#5b6a80;font-weight:800}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}.g{background:#e7f6ee}.y{background:#f8efcf}.l{background:#fff6d8}.bl{background:#eaf2ff}
.hrow{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
.badge{background:var(--navy);color:#fff;min-width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;padding:0 6px}
.acc{background:#fff;border:1px solid #eee4d0;border-radius:16px;overflow:hidden}
.acc>summary{cursor:pointer;padding:14px 16px;font-weight:800;color:var(--navy);list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
.acc>summary::-webkit-details-marker{display:none}.ls{margin:0;border:0;border-top:1px solid #f3ead8;border-radius:0}.ls>summary{padding:12px 16px;font-size:15px}
.id{margin:0;border:0;border-top:1px dashed #efe4cc;border-radius:0;background:#fffcf6}.id>summary{padding:11px 16px;font-size:14px;color:#2c4a73}
.qlist{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 12px 14px}
.qnum{min-height:42px;border:1px solid #eadfc6;background:#fff;border-radius:12px;font-weight:800;color:var(--navy)}
.empty{padding:12px 16px;color:#7a8494;font-size:13px}
.pop{position:fixed;inset:0;background:rgba(22,48,86,.28);display:grid;place-items:center;padding:16px;z-index:50}
.qcard{width:min(390px,100%);background:#fffdf8;border:1px solid #e8d7a8;border-radius:22px;padding:16px 14px 14px;box-shadow:0 16px 40px rgba(22,48,86,.18)}
.qcard.gold{border-color:#e4c56a;background:#fffaf0}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.kindtag{font-size:12px;font-weight:800;border-radius:999px;padding:5px 10px}
.kindtag.n{background:#f8efcf;color:#8a6a10}.kindtag.t{background:#e8f6ee;color:#2f8a5b}
.x{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff}
.qtxt{text-align:center;font-weight:800;font-size:16px;line-height:1.85;color:var(--navy);padding:8px 4px 12px;border-bottom:1px solid #efe3c4;margin-bottom:10px}
.qimg{max-width:100%;border-radius:12px;margin:0 auto 8px;display:block}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{min-height:44px;border-radius:14px;font-weight:800;font-size:13px;border:1.5px solid transparent}
.s-idea{background:#fff3c4;color:#7a5b08;border-color:#f0d36a}.s-given{background:#d9f3e8;color:#1f7a56;border-color:#9ed9bf}.s-steps{background:#dce8fb;color:#1d4f9a;border-color:#9bb8e8}.s-req{background:#fde2c8;color:#9a4b12;border-color:#f0b27a}
.s-idea.on{background:#e0b423;color:#fff}.s-given.on{background:#2f8a5b;color:#fff}.s-steps.on{background:#2563eb;color:#fff}.s-req.on{background:#163056;color:#fff}
.slotbox{margin-top:10px;border-radius:14px;padding:12px;font-size:14px;font-weight:700;line-height:1.8}
.slotbox.idea{background:#fff6d8;color:#7a5b08}.slotbox.given{background:#e7f6ee;color:#1f7a56}.slotbox.steps{background:#eaf2ff;color:#1d4f9a}.slotbox.req{background:#f7f1e4;color:#163056}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 4px}
.frac .num{border-bottom:1.6px solid currentColor;padding:0 4px 1px;font-size:.86em}.frac .den{padding:1px 4px 0;font-size:.86em}
.nav{position:fixed;bottom:58px;right:0;left:0;background:#fbf8f1;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 6px 12px;z-index:30}
.nav button{border:0;background:0;font-weight:800;color:#5b6a80;padding:8px}.nav button.on{color:var(--navy)}
.book{height:calc(100dvh - 170px);border:1px solid #eee4d0;border-radius:16px;overflow:hidden;background:#fff}
.book iframe{width:100%;height:100%;border:0}
.mask{position:fixed;inset:0;background:rgba(20,30,48,.35);display:grid;place-items:center;padding:12px;z-index:40}
.sheet{width:min(430px,100%);max-height:92dvh;overflow:auto;background:#fffcf7;border-radius:22px;padding:16px}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cnt{text-align:left;font-size:11px;color:#8a7a62;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{height:30px;border:1px solid #eadfc6;background:#fff;border-radius:999px;padding:0 10px;font-size:11px;font-weight:800;color:#2c4a73}
.drop{border:1.5px dashed #d7c9a6;border-radius:12px;padding:12px;text-align:center;background:#fff;margin:8px 0;font-size:13px;font-weight:700;color:#5b6a80}
.drop input{display:none}.chk{display:flex;align-items:center;gap:8px;font-weight:800;margin:8px 0}
.foot{display:flex;justify-content:space-between;margin-top:12px}.foot button{height:42px;padding:0 18px;border:0;border-radius:12px;font-weight:800}.gray{background:#ece9e1}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;z-index:60;font-weight:800}.view{display:none}.view.on{display:block}
</style></head><body>
<section class="login" id="login"><div class="box"><div class="logo">⟩</div><h1>رابط المسائل</h1>
<div class="field"><label>الدخول كـ</label><select id="role"><option value="student">طالب</option><option value="teacher">معلم</option></select></div>
<div class="field"><label id="idLab">رقم الطالب</label><input id="sid" inputmode="numeric"></div>
<div class="field"><label>الرقم السري</label><input id="pin" type="password"></div>
<button class="go" id="loginBtn">دخول</button><div class="err" id="err">رقم غير صحيح</div>
<div class="hint" id="hint">طالب: ١٠٠١ / ١٢٣٤</div></div></section>
<section class="app hidden" id="app">
<nav class="nav">
<button class="on" data-view="home">الرئيسية</button>
<button data-view="book">كتاب النشاط</button>
<button id="out">خروج</button>
</nav>
<div class="top" id="topBar"><div class="brand"><div class="logo">⟩</div><div><h2>رابط المسائل</h2><small id="who">القياس الدائري</small></div></div>
<div class="actions"><button class="b1" id="btnSearch">بحث</button><button class="b2 hidden" id="btnAdd">إضافة</button></div></div>
<div id="view-home" class="view on">
<div class="stats">
<div class="stat"><div><b id="nTan">٠</b><span>تنويع</span></div><div class="ico g">▤</div></div>
<div class="stat"><div><b id="nNew">٠</b><span>جديدة</span></div><div class="ico y">★</div></div>
<div class="stat"><div><b id="nIdea">٠</b><span>أفكار</span></div><div class="ico l">💡</div></div>
<div class="stat"><div><b id="nAll">٠</b><span>مسائل</span></div><div class="ico bl">📋</div></div></div>
<div class="hrow"><strong>الوحدة — الدرس — الفكرة — رقم السؤال</strong><span class="badge" id="nBadge">٠</span></div>
<div id="homeCards"></div></div>
<div id="view-book" class="view"><div class="book"><iframe id="bookFrame" src="activity.html?v=3" title="كتاب النشاط"></iframe></div></div>
</section>
<div class="pop hidden" id="pop"><div class="qcard" id="popCard"></div></div>
<div class="mask hidden" id="addM"><div class="sheet">
<div class="row"><h3>إضافة مسألة</h3><button class="x" data-close="addM">×</button></div>
<div class="grid2">
<div class="field"><label>الوحدة</label><select id="punit"><option>الوحدة الأولى: القياس الدائري</option></select></div>
<div class="field"><label>الدرس</label><select id="plesson"><option value="1-1">١-١ الراديان</option><option value="1-2">١-٢ طول القوس</option><option value="1-3">١-٣ مساحة القطاع الدائري</option></select></div>
</div>
<div class="field"><label>نص المسألة</label><textarea class="area" id="ptxt" maxlength="300"></textarea><div class="cnt"><span id="pcnt">٠</span> / ٣٠٠</div></div>
<div class="chips">
<button type="button" class="chip" data-idea="تحويل درجة إلى راديان">تحويل درجة إلى راديان</button>
<button type="button" class="chip" data-idea="تحويل راديان إلى درجة">تحويل راديان إلى درجة</button>
<button type="button" class="chip" data-idea="طول القوس">طول القوس</button>
<button type="button" class="chip" data-idea="مساحة القطاع">مساحة القطاع</button>
</div>
<label class="drop">ارفع صورة المسألة<input type="file" id="pimg" accept="image/*"></label>
<img id="pprev" class="qimg hidden" alt="">
<div class="grid2">
<div class="field"><label>الفكرة</label><input id="pidea"></div>
<div class="field"><label>المعطيات</label><input id="pgiven"></div>
<div class="field"><label>الخطوات</label><input id="psteps"></div>
<div class="field"><label>المطلوب</label><input id="preq"></div>
</div>
<label class="chk"><input type="checkbox" id="pnew"> هذه فكرة جديدة</label>
<div class="foot"><button class="gray" data-close="addM">إلغاء</button><button class="b2" id="save">حفظ</button></div>
</div></div>
<script src="questions-data.js"></script>
<script src="questions-l23.js"></script>
<script>
const AR='٠١٢٣٤٥٦٧٨٩';
const toAr=n=>String(n).replace(/\d/g,d=>AR[d]);
const en=s=>String(s).replace(/[٠-٩]/g,d=>AR.indexOf(d));
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const KEY='rabt-items-v6';
let IMG='', IS_TEACHER=false;
const UNIT={title:'الوحدة الأولى: القياس الدائري', lessons:[
  {id:'1-1', title:'١-١ الراديان', page:'١١'},
  {id:'1-2', title:'١-٢ طول القوس', page:'١٥'},
  {id:'1-3', title:'١-٣ مساحة القطاع الدائري', page:'١٨'}
]};
function F(a,b){return '<span class="frac"><span class="num">'+a+'</span><span class="den">'+b+'</span></span>'}
function fracify(s){
  s=String(s==null?'':s);
  s=s.replace(/½/g,F('١','٢')).replace(/¼/g,F('١','٤'));
  s=s.replace(/(٠-٩0-9]*)π\s*\/\s*([٠-٩0-9]+)/g,(m,a,b)=>F((a||'')+'π',b));
  s=s.replace(/π\s*\/\s*([٠-٩0-9]+)/g,(m,b)=>F('π',b));
  s=s.replace(/([٠-٩0-9]+)\s*\/\s*([٠-٩0-9]+)/g,(m,a,b)=>F(a,b));
  return s;
}
function bankItems(){const meta=window.RABT_META||{};return (window.RABT_BANK||[]).map((q,i)=>{const m=meta[q.kind]||{};return {id:'bank-'+i,ex:q.ex,letter:q.letter,text:q.text,type:m.type||'tanwee',idea:m.idea||'بدون فكرة',steps:m.steps||'',required:m.required||'',kind:q.kind,lesson:m.lesson||'1-1',img:''};});}
function load(){const bank=bankItems();try{let a=JSON.parse(localStorage.getItem(KEY)||'[]');if(a.length<bank.length){a=bank.concat(a.filter(x=>String(x.id).startsWith('u')));localStorage.setItem(KEY,JSON.stringify(a))}return a.length?a:bank;}catch(e){return bank}}
function saveAll(a){localStorage.setItem(KEY,JSON.stringify(a))}
function openM(id){$('#'+id).classList.remove('hidden')} function closeM(id){$('#'+id).classList.add('hidden')}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1500)}
function stats(items){$('#nAll').textContent=toAr(items.length);$('#nNew').textContent=toAr(items.filter(x=>x.type==='idea').length);$('#nTan').textContent=toAr(items.filter(x=>x.type==='tanwee').length);$('#nIdea').textContent=toAr([...new Set(items.map(x=>x.idea).filter(Boolean))].length);$('#nBadge').textContent=toAr(items.length)}
function givenOf(p){return p.given||p.text||'—'}
function showView(name){
  $$('.view').forEach(v=>v.classList.remove('on'));
  $('#view-'+name).classList.add('on');
  $$('nav [data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===name));
  $('#topBar').classList.toggle('hidden', name==='book');
  if(name==='book') $('#bookFrame').src='activity.html?v=3&t='+Date.now();
}
function showQ(p){
  const neu=p.type==='idea';
  const card=$('#popCard');
  card.className='qcard'+(neu?' gold':'');
  card.innerHTML='<div class="qhead"><span class="kindtag '+(neu?'n':'t')+'">'+(neu?'★ فكرة جديدة':'تنويع')+'</span><div style="display:flex;gap:8px;align-items:center"><small>سؤال '+p.ex+' — '+p.letter+'</small><button class="x" id="popX">×</button></div></div>'
    +(p.img?'<img class="qimg" src="'+p.img+'">':'')
    +'<div class="qtxt">'+fracify(p.text)+'</div>'
    +'<div class="slots">'
    +'<button type="button" class="slot s-idea" data-k="idea">الفكرة</button>'
    +'<button type="button" class="slot s-given" data-k="given">المعطيات</button>'
    +'<button type="button" class="slot s-steps" data-k="steps">الخطوات</button>'
    +'<button type="button" class="slot s-req" data-k="req">المطلوب</button>'
    +'</div><div class="slotbox hidden" id="slotBox"></div>';
  const map={idea:[fracify(p.idea||'—'),'idea'],given:[fracify(givenOf(p)),'given'],steps:[fracify(p.steps||'—'),'steps'],req:[fracify(p.required||'—'),'req']};
  const titles={idea:'الفكرة',given:'المعطيات',steps:'الخطوات',req:'المطلوب'};
  const box=$('#slotBox');
  card.querySelectorAll('.slot').forEach(s=>s.onclick=()=>{
    const on=s.classList.contains('on');
    card.querySelectorAll('.slot').forEach(x=>x.classList.remove('on'));
    if(on){box.classList.add('hidden');return}
    s.classList.add('on'); box.classList.remove('hidden');
    const k=s.dataset.k; box.className='slotbox '+map[k][1]; box.innerHTML='<b>'+titles[k]+'</b><br>'+map[k][0];
  });
  $('#popX').onclick=()=>$('#pop').classList.add('hidden');
  $('#pop').classList.remove('hidden');
}
function render(){
 const items=load(); stats(items);
 let html='<details class="acc" open><summary><span>'+UNIT.title+'</span><span class="badge">'+toAr(items.length)+'</span></summary>';
 UNIT.lessons.forEach((ls,i)=>{
  const arr=items.filter(p=>(p.lesson||'1-1')===ls.id);
  html+='<details class="acc ls"'+(i===0?' open':'')+'><summary><span>'+ls.title+'</span><small>ص '+ls.page+'</small></summary>';
  if(!arr.length) html+='<div class="empty">لا توجد أفكار بعد</div>';
  else {
   const ideas=new Map(); arr.forEach(p=>{const k=p.idea||'بدون فكرة'; if(!ideas.has(k)) ideas.set(k,[]); ideas.get(k).push(p)});
   ideas.forEach((qs,idea)=>{
    html+='<details class="acc id"><summary><span>'+fracify(idea)+'</span><span class="badge">'+toAr(qs.length)+'</span></summary><div class="qlist">';
    qs.forEach(p=>{html+='<button type="button" class="qnum" data-id="'+p.id+'">سؤال '+p.ex+' — '+(p.letter||'—')+'</button>';});
    html+='</div></details>';
   });
  }
  html+='</details>';
 });
 html+='</details>'; $('#homeCards').innerHTML=html;
 $$('#homeCards .qnum').forEach(b=>b.onclick=()=>{const p=load().find(x=>String(x.id)===b.dataset.id); if(p) showQ(p)});
}
function enterApp(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden'); if(IS_TEACHER){$('#btnAdd').classList.remove('hidden');$('#who').textContent='حساب المعلم'}else{$('#btnAdd').classList.add('hidden');$('#who').textContent='حساب الطالب'} showView('home'); render()}
$('#role').onchange=()=>{const t=$('#role').value==='teacher'; $('#idLab').textContent=t?'رقم المعلم':'رقم الطالب'; $('#hint').textContent=t?'معلم: ٩٠٠١ / ٢٤٦٨':'طالب: ١٠٠١ / ١٢٣٤'};
$('#loginBtn').onclick=()=>{const id=en($('#sid').value.trim()), pin=en($('#pin').value.trim()), role=$('#role').value; $('#err').style.display='none';
  if(role==='teacher'){if(!(id==='9001'&&pin==='2468')){$('#err').style.display='block';return} IS_TEACHER=true; enterApp(); return}
  if(!(id==='1001'&&pin==='1234')){$('#err').style.display='block';return} IS_TEACHER=false; enterApp()};
$('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginBtn').click()});
$$('nav [data-view]').forEach(b=>b.onclick=()=>showView(b.dataset.view));
$('#out').onclick=()=>{IS_TEACHER=false;$('#btnAdd').classList.add('hidden');$('#app').classList.add('hidden');$('#login').classList.remove('hidden')};
$('#btnAdd').onclick=()=>{if(!IS_TEACHER){toast('الإضافة للمعلم فقط');return} openM('addM')};
$$('[data-close]').forEach(b=>b.onclick=()=>closeM(b.dataset.close));
$('#pop').onclick=e=>{if(e.target.id==='pop')$('#pop').classList.add('hidden')};
$('#ptxt').addEventListener('input',()=>{$('#pcnt').textContent=toAr($('#ptxt').value.length)});
$$('.chip').forEach(c=>c.onclick=()=>{$('#pidea').value=c.dataset.idea});
$('#pimg').onchange=e=>{const f=e.target.files&&e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{IMG=r.result; $('#pprev').src=IMG; $('#pprev').classList.remove('hidden')}; r.readAsDataURL(f)};
$('#save').onclick=()=>{
  if(!IS_TEACHER){toast('الإضافة للمعلم فقط');return}
  const text=$('#ptxt').value.trim(); if(!text&&!IMG){toast('اكتب النص أو ارفع صورة');return}
  const a=load();
  a.push({id:'u'+Date.now(),ex:toAr(a.filter(x=>x.lesson===$('#plesson').value).length+1),letter:'—',text,type:$('#pnew').checked?'idea':'tanwee',idea:$('#pidea').value.trim()||'فكرة مضافة',given:$('#pgiven').value.trim(),steps:$('#psteps').value.trim(),required:$('#preq').value.trim(),lesson:$('#plesson').value,img:IMG});
  saveAll(a); IMG=''; $('#pprev').classList.add('hidden'); $('#ptxt').value=''; closeM('addM'); render(); toast('أُضيفت في الدرس');
};
</script></body></html>
