<script>
function b64ToUtf8(s){const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(b)}
const fr=document.getElementById('fr');
if(window.B64_1_1) fr.srcdoc=b64ToUtf8(window.B64_1_1);
else fr.srcdoc='<p style="font-family:Cairo,Tahoma;padding:24px;text-align:center">جاري تحميل ملف الدرس …</p>';
</script>
