<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>تمارين ١-١ الراديان</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF6EC;font-family:Cairo,Tahoma,sans-serif;color:#2B2320;padding:12px 12px 80px}
.hero{text-align:center}h1{margin:4px 0;color:#2B4570}
.board{display:flex;justify-content:space-between;background:#fff;border:2px solid #2B2320;border-radius:14px;padding:10px;margin:10px 0;font-weight:800}
.card{background:#fff;border:2px solid #2B2320;border-radius:16px;padding:12px;margin:12px 0}
.item{background:#FBF6EC;border-radius:12px;padding:8px;margin:8px 0;font-weight:700}
input{width:130px;height:36px;border:1.5px solid #d7c9a6;border-radius:10px;text-align:center;font:16px Cairo}
button{font:800 14px Cairo;border:2px solid #2B2320;background:#fff;border-radius:10px;padding:7px 10px;margin:4px 4px 0 0}
button.p{background:#2B2320;color:#fff}.reveal{display:none;margin-top:8px;padding:8px;background:#fff6d8;border-radius:10px;line-height:1.8}.reveal.show{display:block}.mark{margin-right:8px}
</style></head><body>
<div class="hero"><div>الوحدة الأولى</div><h1>١-١ الراديان</h1>
<p>هـراد = هـ° × π ÷ ١٨٠</p></div>
<div class="board"><span>نتيجتك: <b id="sc">٠ / ٠</b></span><button onclick="resetAll()">إعادة</button></div>
<section class="card"><h3>١) حوّل إلى راديان بدلالة π</h3>
<div class="item">أ) ٩٠° <input id="q1a"><span class="mark" id="m-q1a"></span></div>
<div class="item">ب) ٤٥° <input id="q1b"><span class="mark" id="m-q1b"></span></div>
<div class="item">ج) ٣٠° <input id="q1c"><span class="mark" id="m-q1c"></span></div>
<button class="p" onclick="chk1()">تحقّق</button><button onclick="tog('a1')">الإجابة</button>
<div class="reveal" id="a1">π/٢ &nbsp; π/٤ &nbsp; π/٦</div></section>
<section class="card"><h3>٢) حوّل إلى درجات</h3>
<div class="item">π/٦ <input id="q2a"><span class="mark" id="m-q2a"></span></div>
<div class="item">π/٣ <input id="q2b"><span class="mark" id="m-q2b"></span></div>
<button class="p" onclick="chk2()">تحقّق</button><button onclick="tog('a2')">الإجابة</button>
<div class="reveal" id="a2">٣٠° &nbsp; ٦٠°</div></section>
<script>
const AR='٠١٢٣٤٥٦٧٨٩';
const west=s=>String(s||'').replace(/[٠-٩]/g,d=>String(AR.indexOf(d)));
const arn=n=>String(n).replace(/\d/g,d=>AR[d]);
const tog=id=>document.getElementById(id).classList.toggle('show');
function norm(s){return west(s).toLowerCase().replace(/π|pi|باي/g,'π').replace(/[° درجةراد]/g,'').replace(/\s+/g,'');}
function ok(id,acc){const v=norm(document.getElementById(id).value);const g=acc.some(a=>norm(a)===v||v.includes(norm(a)));document.getElementById('m-'+id).textContent=g?'✅':'❌';}
function score(){let c=0,t=0;document.querySelectorAll('[id^=m-]').forEach(e=>{t++;if(e.textContent==='✅')c++});document.getElementById('sc').textContent=arn(c)+' / '+arn(t);}
function resetAll(){document.querySelectorAll('input').forEach(i=>i.value='');document.querySelectorAll('[id^=m-]').forEach(e=>e.textContent='');document.querySelectorAll('.reveal').forEach(e=>e.classList.remove('show'));score();}
function chk1(){ok('q1a',['π/2','1π/2']);ok('q1b',['π/4']);ok('q1c',['π/6']);score()}
function chk2(){ok('q2a',['30']);ok('q2b',['60']);score()}
score();
</script></body></html>
