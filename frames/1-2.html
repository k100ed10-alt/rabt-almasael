<script>
function b64ToUtf8(s){
  const bin=atob(s);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
try{
  document.getElementById('fr').srcdoc=b64ToUtf8(window.B64_1_2);
}catch(e){
  document.body.innerHTML='<p style="font-family:Cairo,Tahoma;padding:20px">تعذر فتح الدرس</p>';
}
</script>
