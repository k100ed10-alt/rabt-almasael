<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>١-٢</title>
<style>html,body{margin:0;height:100%;height:100dvh;overflow:hidden;background:#FBF6EC}iframe{width:100%;height:100%;border:0;display:block}</style>
</head><body>
<iframe id="fr" title="١-٢ طول القوس"></iframe>
<script src="../js/b64-1-2-1.js"></script>

<script>
function b64ToUtf8(s){const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(b)}
const fr=document.getElementById('fr');
if(window.B64_1_2){fr.srcdoc=b64ToUtf8(window.B64_1_2)}
else{
fr.srcdoc=`<!DOCTYPE html><html lang=ar dir=rtl><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&display=swap" rel=stylesheet>
<style>body{margin:0;background:#FBF6EC;font-family:Cairo,Tahoma;padding:12px 12px 80px}h1{color:#2B4570;text-align:center}.card{background:#fff;border:2px solid #2B2320;border-radius:16px;padding:12px;margin:12px 0}.item{background:#FBF6EC;border-radius:12px;padding:8px;margin:8px 0;font-weight:700}input{width:120px;height:36px;border:1.5px solid #d7c9a6;border-radius:10px;text-align:center;font:16px Cairo}button{font:800 14px Cairo;border:2px solid #2B2320;background:#fff;border-radius:10px;padding:7px 10px;margin:4px}button.p{background:#2B2320;color:#fff}.reveal{display:none;margin-top:8px;padding:8px;background:#fff6d8;border-radius:10px}.reveal.show{display:block}</style></head><body>
<h1>١-٢ طول القوس</h1>
<p style=text-align:center>ن = نق × هـ</p>
<div class=card><div class=item>١) نق=٨ ن=٧.٥ راديان <input id=q1a> <span id=m-q1a></span></div>
<div class=item>درجات <input id=q1b> <span id=m-q1b></span></div>
<button class=p onclick=chk1()>تحقّق</button></div>
<div class=card><div class=item>٢) ن=١٢ هـ=١.٦ نق <input id=q2> <span id=m-q2></span></div>
<button class=p onclick=chk2()>تحقّق</button></div>
<div class=card><div class=item>٩) نق=٢٥ وتر=١٤ المحيط <input id=q9> <span id=m-q9></span></div>
<button class=p onclick=chk9()>تحقّق</button></div>
<script>const w=s=>String(s||'').replace(/[٠-٩]/g,d=>'0123456789'['٠١٢٣٤٥٦٧٨٩'.indexOf(d)]);
function ok(id,n){const v=parseFloat(w(document.getElementById(id).value).replace(/[^\\d.\\-]/g,''));document.getElementById('m-'+id).textContent=(!isNaN(v)&&Math.abs(v-n)<=Math.max(0.03,Math.abs(n)*0.02))?'\u2705':'\u274c'}
function chk1(){ok('q1a',0.938);ok('q1b',53.7)}function chk2(){ok('q2',7.5)}function chk9(){ok('q9',28.2)}</script></body></html>`;
}
</script></body></html>
