<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>تمارين ١-٣ مساحة القطاع</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF6EC;font-family:Cairo,Tahoma,sans-serif;color:#2B2320;padding:12px 12px 80px}
.hero{text-align:center}h1{margin:4px 0;color:#2B4570}
.board{display:flex;justify-content:space-between;background:#fff;border:2px solid #2B2320;border-radius:14px;padding:10px;margin:10px 0;font-weight:800}
.card{background:#fff;border:2px solid #2B2320;border-radius:16px;padding:12px;margin:12px 0}
.item{background:#FBF6EC;border-radius:12px;padding:8px;margin:8px 0;font-weight:700}
input{width:140px;height:36px;border:1.5px solid #d7c9a6;border-radius:10px;text-align:center;font:16px Cairo}
button{font:800 14px Cairo;border:2px solid #2B2320;background:#fff;border-radius:10px;padding:7px 10px;margin:4px 4px 0 0}
button.p{background:#2B2320;color:#fff}.reveal{display:none;margin-top:8px;padding:8px;background:#fff6d8;border-radius:10px;line-height:1.8}.reveal.show{display:block}.mark{margin-right:8px}
</style></head><body>
<div class="hero"><div>الوحدة الأولى</div><h1>١-٣ مساحة القطاع</h1>
<p>أ = ½ نق² هـ</p></div>
<div class="board"><span>نتيجتك: <b id="sc">٠ / ٠</b></span><button onclick="resetAll()">إعادة</button></div>
<section class="card"><h3>١) هـ=١.٢ ، أ=٥٤ أوجد نق</h3>
<div class="item">نق ≈ <input id="s1"><span class="mark" id="m-s1"></span></div>
<button class="p" onclick="chks1()">تحقّق</button><button onclick="tog('as1')">الإجابة</button>
<div class="reveal" id="as1">٩.٤٩ سم</div></section>
<section class="card"><h3>٢) محيط=٢٨ ، هـ=١.٦ أوجد المساحة</h3>
<div class="item">المساحة ≈ <input id="s2"><span class="mark" id="m-s2"></span></div>
<button class="p" onclick="chks2()">تحقّق</button><button onclick="tog('as2')">الإجابة</button>
<div class="reveal" id="as2">٤٨.٤ سم²</div></section>
<section class="card"><h3>٩) مثلث رولو نق=٢</h3>
<div class="item">المحيط <input id="s9a"><span class="mark" id="m-s9a"></span></div>
<div class="item">المساحة <input id="s9b"><span class="mark" id="m-s9b"></span></div>
<button class="p" onclick="chks9()">تحقّق</button><button onclick="tog('as9')">الإجابة</button>
<div class="reveal" id="as9">٢π &nbsp; ، &nbsp; ٢(π−√٣)</div></section>
<script>
const AR='٠١٢٣٤٥٦٧٨٩';
const west=s=>String(s||'').replace(/[٠-٩]/g,d=>String(AR.indexOf(d)));
const arn=n=>String(n).replace(/\d/g,d=>AR[d]);
const tog=id=>document.getElementById(id).classList.toggle('show');
function norm(s){return west(s).toLowerCase().replace(/π|pi|باي/g,'π').replace(/jذر|sqrt|√/g,'√').replace(/[سم² ]/g,'').replace(/\s+/g,'');}
function closeEnough(v,t){const n=parseFloat(west(v).replace(/[^\d.\-]/g,''));return !isNaN(n)&&Math.abs(n-t)<=Math.max(0.03,Math.abs(t)*0.02);}
function ok(id,acc,num){const v=norm(document.getElementById(id).value);let g=acc.some(a=>norm(a)===v||v.includes(norm(a)));if(!g&&num!=null)g=closeEnough(v,num);document.getElementById('m-'+id).textContent=g?'✅':'❌';}
function score(){let c=0,t=0;document.querySelectorAll('[id^=m-]').forEach(e=>{t++;if(e.textContent==='✅')c++});document.getElementById('sc').textContent=arn(c)+' / '+arn(t);}
function resetAll(){document.querySelectorAll('input').forEach(i=>i.value='');document.querySelectorAll('[id^=m-]').forEach(e=>e.textContent='');document.querySelectorAll('.reveal').forEach(e=>e.classList.remove('show'));score();}
function chks1(){ok('s1',['9.49'],9.49);score()}
function chks2(){ok('s2',['48.4'],48.4);score()}
function chks9(){ok('s9a',['2π','2pi']);ok('s9b',['2(π-√3)','2(π-√٣)','2π-2√3']);score()}
score();
</script></body></html>
